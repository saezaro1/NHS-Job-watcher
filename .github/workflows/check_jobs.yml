name: NHS Job Watcher

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run job watcher
        run: python job_watcher.py

      - name: Commit updated files
        run: |
          git config --global user.name "job-watcher-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add index.html seen_jobs.json
          git diff --staged --quiet || git commit -m "Update job listings [skip ci]"
          git push
